name: Vacation Brain CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-js-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check admin permissions contract
        run: php tests/permissions_contract.php

      - name: Check config runtime contract
        run: php tests/config_runtime_contract.php

      - name: Check landing merch contract
        run: php tests/landing_merch_contract.php

      - name: Check public header contract
        run: php tests/public_header_contract.php

      - name: Check dashboard trip contract
        run: php tests/dashboard_trip_contract.php

      - name: Check dashboard agent tabs contract
        run: php tests/dashboard_agent_tabs_contract.php

      - name: Check dashboard recently viewed contract
        run: php tests/dashboard_recent_contract.php

      - name: Check dashboard agent context contract
        run: php tests/dashboard_agent_context_contract.php

      - name: Check Vacation Brain Photos contract
        run: php tests/photos_contract.php

      - name: Check destination owner account contract
        run: php tests/destination_owner_contract.php

      - name: Check trip intelligence contract
        run: php tests/trip_intelligence_contract.php

      - name: Check Destination Watches contract
        run: php tests/travel_watches_contract.php

      - name: Check Brain Activity contract
        run: php tests/brain_activity_contract.php

      - name: Check Trip Agent Jobs contract
        run: php tests/trip_agent_jobs_contract.php

      - name: Check Trip Agent Batches contract
        run: php tests/trip_agent_batches_contract.php

      - name: Check Trip Agent Automation contract
        run: php tests/trip_agent_automation_contract.php

      - name: Check Trip Agent Actions contract
        run: php tests/trip_agent_actions_contract.php

      - name: Check Trip Action Execution contract
        run: php tests/trip_action_execution_contract.php

      - name: Check Trip Command Center contract
        run: php tests/trip_command_center_contract.php

      - name: Check Unified Trip Communications + Action Inbox contract
        run: php tests/unified_trip_inbox_contract.php

      - name: Check Complete Itinerary Intelligence contract
        run: php tests/complete_itinerary_intelligence_contract.php

      - name: Check Travel Day Copilot 2.0 contract
        run: php tests/travel_day_copilot_contract.php

      - name: Check Recovery & Rebooking Intelligence contract
        run: php tests/recovery_rebooking_intelligence_contract.php

      - name: Check Disruption Resolution + Refund/Credit Intelligence contract
        run: php tests/disruption_resolution_refund_contract.php

      - name: Check Trip Cost Intelligence + True Trip Economics contract
        run: php tests/trip_cost_intelligence_contract.php

      - name: Check Booking + Trip Readiness contract
        run: php tests/trip_booking_readiness_contract.php

      - name: Check Booking Inbox + Automatic Trip Import contract
        run: php tests/booking_inbox_contract.php

      - name: Check Connected Booking Inbox + Reservation Change Intelligence contract
        run: php tests/connected_booking_inbox_contract.php

      - name: Check Travel Day Operations contract
        run: php tests/travel_day_operations_contract.php

      - name: Check Post-Trip Memory contract
        run: php tests/post_trip_memory_contract.php

      - name: Check Traveler Memory Graph contract
        run: php tests/traveler_memory_graph_contract.php

      - name: Check Live Travel Providers contract
        run: php tests/live_travel_providers_contract.php

      - name: Check Proactive Vacation Brain contract
        run: php tests/proactive_vacation_brain_contract.php

      - name: Check Booking & Action Execution contract
        run: php tests/booking_action_execution_contract.php

      - name: Check Collaborative Trips & Travelers contract
        run: php tests/collaborative_trips_contract.php

      - name: Check Destination & Local Concierge contract
        run: php tests/local_concierge_contract.php

      - name: Check Autonomous Travel Operations contract
        run: php tests/autonomous_travel_operations_contract.php

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/shell-commerce.js
          node --check assets/dashboard-trips.js
          node --check assets/dashboard-tabs.js
          node --check assets/dashboard-agent-bar.js
          node --check assets/photos.js
          node --check assets/trip-intelligence.js
          node --check assets/travel-watches.js
          node --check assets/brain-activity.js
          node --check assets/trip-command-center.js
          node --check assets/trip-booking-summary.js
          node --check assets/trip-workspace-tabs.js
          node --check assets/travel-mode.js
          node --check assets/travel-mode-offline.js
          node --check assets/live-travel-data.js
          node --check assets/local-concierge.js

      - name: Verify ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f db/001_schema.sql
          test -f db/032_dashboard_agent_tabs.sql
          test -f db/033_vacation_brain_photos.sql
          test -f db/034_destination_owner_accounts.sql
          test -f db/035_trip_intelligence.sql
          test -f db/036_travel_watches.sql
          test -f db/037_trip_agent_jobs.sql
          test -f db/038_trip_agent_intelligence_batches.sql
          test -f db/039_trip_agent_automation_triggers.sql
          test -f db/040_trip_agent_action_queue.sql
          test -f db/041_trip_action_execution_approval.sql
          test -f db/042_trip_booking_readiness.sql
          test -f db/043_travel_day_operations.sql
          test -f db/044_post_trip_memory.sql
          test -f db/045_traveler_memory_graph.sql
          test -f db/046_live_travel_providers.sql
          test -f db/047_proactive_vacation_brain.sql
          test -f db/048_booking_action_execution.sql
          test -f db/049_collaborative_trips.sql
          test -f db/050_local_concierge.sql
          test -f db/051_autonomous_travel_operations.sql
          test -f db/052_booking_inbox.sql
          test -f db/053_connected_booking_inbox.sql
          test -f db/054_unified_trip_inbox.sql
          test -f db/055_complete_itinerary_intelligence.sql
          test -f db/056_travel_day_copilot.sql
          test -f db/057_recovery_rebooking_intelligence.sql
          test -f db/058_disruption_resolution_refund_intelligence.sql
          test -f db/059_trip_cost_intelligence.sql
          COUNT=$(find db -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l | tr -d ' ')
          test "$COUNT" -eq 59

      - name: Validate WebP media
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          find assets/merch assets/sample/destinations -type f -name '*.webp' -print0 | xargs -0 -n1 identify >/dev/null

      - name: Build deploy package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vacation-brain-deploy
          mkdir -p /tmp/vacation-brain-deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='vacation-brain-deploy.zip' ./ /tmp/vacation-brain-deploy/
          (cd /tmp/vacation-brain-deploy && zip -qr "$GITHUB_WORKSPACE/vacation-brain-deploy.zip" .)
          test -s vacation-brain-deploy.zip
          unzip -tq vacation-brain-deploy.zip >/dev/null
          unzip -Z1 vacation-brain-deploy.zip > /tmp/vacation-brain-packaged.txt
          required=(
            upgrade.php config-example.php
            api/shell-state.php api/dashboard-tabs.php api/dashboard-destination-context.php api/photos.php api/trip-intelligence.php api/travel-watches.php api/brain-activity.php api/trip-agent-jobs.php api/trip-command-center.php api/trip-bookings.php api/travel-operations.php api/travel-copilot.php
            photos.php dream.php dream-new.php dream-trip.php trip-itinerary.php trip-inbox.php trip-agent.php trip-action.php trip-execution.php trip-bookings.php booking-action.php booking-inbox.php booking-inbox-document.php booking-mailbox.php booking-mail-oauth.php booking-mail-source.php trip-recovery.php trip-resolution.php trip-cost.php
            trip-collaboration.php trip-invite.php shared-trip.php local-concierge.php autonomous-trip.php trip-lodging.php flight-tracking.php travel-mode.php trip-memory.php traveler-memory.php proactive-trip.php proactive-settings.php travel-mode-offline.html watches.php
            admin/travel-providers.php bin/run-travel-watches.php bin/run-trip-agent-jobs.php destination.php destination-dashboard.php destination-edit.php destination-claim.php destination-go.php service-worker.php
            app/Services/AccountTypeService.php app/Services/DestinationOwnerService.php app/Services/TravelProviderSettingsService.php app/Services/TravelDataProviderService.php app/Services/LiveTravelDataProviderService.php app/Services/LiveTravelAgentContextService.php app/Services/BookingActionAgentContextService.php
            app/Services/TripCollaborationService.php app/Services/TripCollaborationAgentContextService.php app/Services/TripItineraryIntelligenceService.php app/Services/TripItineraryAgentContextService.php app/Services/TripTravelDayCopilotService.php app/Services/TripTravelDayCopilotAgentContextService.php app/Services/TripRecoveryIntelligenceService.php app/Services/TripRecoveryAgentContextService.php app/Services/TripDisruptionResolutionService.php app/Services/TripDisruptionResolutionAgentContextService.php app/Services/TripCostIntelligenceService.php app/Services/TripCostIntelligenceAgentContextService.php app/Services/LocalConciergeService.php app/Services/AutonomousTravelOperationsService.php app/Services/TripIntelligenceService.php app/Services/TripLiveIntelligenceService.php app/Services/TripSupervisorService.php app/Services/TripAgentService.php app/Services/TripAgentBatchService.php app/Services/TripAgentActionService.php app/Services/TripAgentExecutionService.php
            app/Services/TripBookingService.php app/Services/TripBookingImportService.php app/Services/BookingImportAgentContextService.php app/Services/BookingMailboxService.php app/Services/BookingMailboxAgentContextService.php app/Services/TripBookingActionService.php app/Services/TripFlightTrackingService.php app/Services/TripBookingReminderService.php app/Services/TripTravelOperationsService.php app/Services/TripMemoryService.php app/Services/TravelerMemoryGraphService.php app/Services/TripCommandCenterService.php app/Services/ProactiveTravelService.php app/Services/TripAgentJobService.php app/Services/TripAgentAutomationService.php app/Services/TravelWatchService.php app/Services/VacationBrainActivityService.php
            app/Services/TripUnifiedInboxService.php app/Services/TripUnifiedInboxAgentContextService.php app/Services/TripUnifiedInboxWorkerService.php
            partials/trip-agent-panel.php partials/trip-action-queue.php partials/trip-command-center.php partials/trip-booking-fields.php partials/traveler-memory-summary.php partials/live-travel-data-panel.php partials/flight-tracking-panel.php partials/proactive-trip-panel.php partials/proactive-dashboard-summary.php partials/trip-itinerary-intelligence.php
            assets/destination-owner.css assets/photos.css assets/photos.js assets/dashboard-agent-bar.css assets/dashboard-agent-bar.js assets/trip-intelligence.css assets/trip-agent-tabs.css assets/trip-live-agents.css assets/trip-intelligence.js assets/live-travel-data.css assets/live-travel-data.js assets/local-concierge.css assets/local-concierge.js assets/autonomous-travel.css assets/travel-providers.css assets/travel-watches.css assets/travel-watches.js assets/brain-activity.css assets/brain-activity.js assets/trip-command-center.css assets/trip-command-center.js assets/trip-bookings.css assets/booking-inbox.css assets/booking-mailbox.css assets/booking-actions.css assets/trip-collaboration.css assets/trip-booking-summary.js assets/trip-workspace-tabs.js assets/trip-itinerary-intelligence.css assets/travel-mode.css assets/travel-mode.js assets/travel-day-copilot.css assets/travel-mode-offline.js assets/recovery-intelligence.css assets/disruption-resolution.css assets/trip-cost-intelligence.css assets/trip-memory.css assets/traveler-memory.css assets/traveler-memory-summary.css assets/proactive-travel.css assets/trip-inbox.css
            assets/shell-commerce.js assets/landing-merch-fix.css assets/dashboard-trips.css assets/dashboard-trips.js assets/dashboard-tabs.css assets/dashboard-tabs.js assets/dashboard-recent.css
            db/032_dashboard_agent_tabs.sql db/033_vacation_brain_photos.sql db/034_destination_owner_accounts.sql db/035_trip_intelligence.sql db/036_travel_watches.sql db/037_trip_agent_jobs.sql db/038_trip_agent_intelligence_batches.sql db/039_trip_agent_automation_triggers.sql db/040_trip_agent_action_queue.sql db/041_trip_action_execution_approval.sql db/042_trip_booking_readiness.sql db/043_travel_day_operations.sql db/044_post_trip_memory.sql db/045_traveler_memory_graph.sql db/046_live_travel_providers.sql db/047_proactive_vacation_brain.sql db/048_booking_action_execution.sql db/049_collaborative_trips.sql db/050_local_concierge.sql db/051_autonomous_travel_operations.sql db/052_booking_inbox.sql db/053_connected_booking_inbox.sql db/054_unified_trip_inbox.sql db/055_complete_itinerary_intelligence.sql db/056_travel_day_copilot.sql db/057_recovery_rebooking_intelligence.sql db/058_disruption_resolution_refund_intelligence.sql db/059_trip_cost_intelligence.sql
            assets/merch/palm-springs-hoodie-front.webp assets/merch/palm-springs-hoodie-back.webp assets/merch/palm-springs-trucker-hat.webp
          )
          for path in "${required[@]}"; do
            grep -Fxq "$path" /tmp/vacation-brain-packaged.txt || { echo "Missing deploy path: $path" >&2; exit 1; }
          done

      - name: Upload deploy package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vacation-brain-deploy
          path: vacation-brain-deploy.zip
          if-no-files-found: error
          retention-days: 30
