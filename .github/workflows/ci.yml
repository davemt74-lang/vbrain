name: Vacation Brain CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-js-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check admin permissions contract
        run: php tests/permissions_contract.php

      - name: Check config runtime contract
        run: php tests/config_runtime_contract.php

      - name: Check landing merch contract
        run: php tests/landing_merch_contract.php

      - name: Check public header contract
        run: php tests/public_header_contract.php

      - name: Check dashboard trip contract
        run: php tests/dashboard_trip_contract.php

      - name: Check dashboard agent tabs contract
        run: php tests/dashboard_agent_tabs_contract.php

      - name: Check dashboard recently viewed contract
        run: php tests/dashboard_recent_contract.php

      - name: Check dashboard agent context contract
        run: php tests/dashboard_agent_context_contract.php

      - name: Check Vacation Brain Photos contract
        run: php tests/photos_contract.php

      - name: Check destination owner account contract
        run: php tests/destination_owner_contract.php

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/shell-commerce.js
          node --check assets/dashboard-trips.js
          node --check assets/dashboard-tabs.js
          node --check assets/dashboard-agent-bar.js
          node --check assets/photos.js

      - name: Verify ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f db/001_schema.sql
          test -f db/032_dashboard_agent_tabs.sql
          test -f db/033_vacation_brain_photos.sql
          test -f db/034_destination_owner_accounts.sql
          COUNT=$(find db -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l | tr -d ' ')
          test "$COUNT" -eq 34

      - name: Validate WebP media
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          find assets/merch assets/sample/destinations -type f -name '*.webp' -print0 | xargs -0 -n1 identify >/dev/null

      - name: Build deploy package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vacation-brain-deploy
          mkdir -p /tmp/vacation-brain-deploy
          rsync -a --exclude='.git' --exclude='.github' --exclude='vacation-brain-deploy.zip' ./ /tmp/vacation-brain-deploy/
          (cd /tmp/vacation-brain-deploy && zip -qr "$GITHUB_WORKSPACE/vacation-brain-deploy.zip" .)
          test -s vacation-brain-deploy.zip
          unzip -l vacation-brain-deploy.zip | grep -q 'upgrade.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'config-example.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'api/shell-state.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'api/dashboard-tabs.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'api/dashboard-destination-context.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'api/photos.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'photos.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'destination-dashboard.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'destination-edit.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'destination-claim.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'destination-go.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'app/Services/AccountTypeService.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'app/Services/DestinationOwnerService.php'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/destination-owner.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/photos.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/photos.js'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-agent-bar.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-agent-bar.js'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/shell-commerce.js'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/landing-merch-fix.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-trips.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-trips.js'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-tabs.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-tabs.js'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/dashboard-recent.css'
          unzip -l vacation-brain-deploy.zip | grep -q 'db/032_dashboard_agent_tabs.sql'
          unzip -l vacation-brain-deploy.zip | grep -q 'db/033_vacation_brain_photos.sql'
          unzip -l vacation-brain-deploy.zip | grep -q 'db/034_destination_owner_accounts.sql'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/merch/palm-springs-hoodie-front.webp'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/merch/palm-springs-hoodie-back.webp'
          unzip -l vacation-brain-deploy.zip | grep -q 'assets/merch/palm-springs-trucker-hat.webp'

      - name: Upload deploy package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vacation-brain-deploy
          path: vacation-brain-deploy.zip
          if-no-files-found: error
          retention-days: 30
