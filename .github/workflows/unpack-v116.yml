name: Unpack Vacation Brain v1.16

on:
  push:
    branches:
      - feature/vacation-brain-v1-16

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack application source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='vacation-brain-deploy (5).zip'
          test -f "$ZIP"
          rm -rf /tmp/vbrain-unpack
          mkdir -p /tmp/vbrain-unpack
          unzip -q "$ZIP" -d /tmp/vbrain-unpack

          SRC=/tmp/vbrain-unpack
          TOP_FILES=$(find "$SRC" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
          TOP_DIRS=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$TOP_FILES" = "0" ] && [ "$TOP_DIRS" = "1" ]; then
            SRC=$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          rsync -a --exclude='.git' "$SRC"/ ./
          rm -f "$ZIP"
          rm -f .github/workflows/unpack-v116.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Vacation Brain v1.16 application source'
          git push origin HEAD:feature/vacation-brain-v1-16
